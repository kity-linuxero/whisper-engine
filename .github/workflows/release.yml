name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - { target: cpu, suffix: cpu, intel_runtime: current }
          - { target: openvino, suffix: openvino, intel_runtime: current }
          - { target: openvino, suffix: openvino-legacy, intel_runtime: legacy }
          - { target: tools, suffix: tools, intel_runtime: current }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: INTEL_RUNTIME=${{ matrix.intel_runtime }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}-${{ matrix.suffix }}
            ghcr.io/${{ github.repository }}:latest-${{ matrix.suffix }}
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
